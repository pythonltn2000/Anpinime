name: PineDrama IPA Static Audit
on:
  push:
    branches: [pinedrama-ipa-audit-20261101]
    paths: ['.github/workflows/pinedrama-ipa-audit.yml', 'tools/pinedrama_ipa_audit.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PineDrama IPA from shared Google Drive
        run: |
          python -m pip install --quiet --disable-pip-version-check gdown
          gdown --fuzzy "https://drive.google.com/file/d/1lHSC81n5GKolWBJRnFRnDAwfFIo9aZQ1/view" --output pinedrama.ipa
          ls -lh pinedrama.ipa
      - name: Scan IPA metadata, URL strings, and Mach-O encryption flags
        run: python tools/pinedrama_ipa_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinedrama-ipa-audit-report
          path: pinedrama_ipa_audit.json
          if-no-files-found: ignore
          retention-days: 1
