name: PineDrama Targeted IPA Audit
on:
  push:
    branches: [pinedrama-ipa-audit-20261101]
    paths: ['.github/workflows/pinedrama-targeted-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download IPA from user's shared Drive file
        run: |
          python -m pip install --quiet gdown
          gdown 1lHSC81n5GKolWBJRnFRnDAwfFIo9aZQ1 --output pinedrama.ipa
      - name: Inspect PineDrama bundle resources
        run: python tools/pinedrama_targeted_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: pinedrama-targeted-audit
          path: pinedrama_targeted_audit.json
          retention-days: 1
