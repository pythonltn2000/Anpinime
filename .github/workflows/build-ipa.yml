name: Build AnyAnime AutoRedirect IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project AnyAnime.xcodeproj \
            -scheme AnyAnime \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
      - name: Assemble unsigned IPA for ESign
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AnyAnime.app Payload/AnyAnime.app
          zip -q -r AnyAnime_AutoRedirect_UNSIGNED.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AnyAnime_AutoRedirect_UNSIGNED
          path: AnyAnime_AutoRedirect_UNSIGNED.ipa
          retention-days: 14
