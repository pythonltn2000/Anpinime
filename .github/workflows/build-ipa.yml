name: Build AnPinime IPA

on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Capture simulator UI previews'
        type: boolean
        default: false
      gateway_frame_only:
        description: 'Check live gateway playback past 15 seconds using captured Core metadata'
        type: boolean
        default: false
      ai_drama_only:
        description: 'Verify the independent Phim AI provider and vertical episode UI'
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  build-ios:
    if: ${{ !inputs.gateway_frame_only && !inputs.ai_drama_only }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Verify parsing and playback regressions
        run: |
          swiftc AnyAnime/Models.swift AnyAnime/AnimeSiteConfiguration.swift AnyAnime/AnimeScheduleStore.swift AnyAnime/HTMLDocument.swift AnyAnime/HTMLParser.swift AnyAnime/MovieBrowseCatalog.swift AnyAnime/MovieCatalog.swift AnyAnime/Phim4KCatalog.swift AnyAnime/Phim4KVIPResolver.swift AnyAnime/Phim4KTransportPolicy.swift AnyAnime/Phim4KMediaProbe.swift AnyAnime/Phim4KRelayNaming.swift AnyAnime/SearchHistory.swift AnyAnime/FilmMediaTransform.swift Tests/main.swift -o "$RUNNER_TEMP/anpinime-parser-tests"
          "$RUNNER_TEMP/anpinime-parser-tests"
          swiftc AnyAnime/Phim4KTransportPolicy.swift AnyAnime/Phim4KMediaProbe.swift AnyAnime/Phim4KVIPResolver.swift Tests/Phim4KResolverTests.swift -o "$RUNNER_TEMP/anpinime-resolver-tests"
          "$RUNNER_TEMP/anpinime-resolver-tests"
          swiftc AnyAnime/Models.swift AnyAnime/AnimeSiteConfiguration.swift AnyAnime/AnimeScheduleStore.swift AnyAnime/HTMLDocument.swift AnyAnime/HTMLParser.swift AnyAnime/MovieBrowseCatalog.swift AnyAnime/MovieCatalog.swift AnyAnime/Phim4KCatalog.swift AnyAnime/Phim4KVIPResolver.swift AnyAnime/Phim4KTransportPolicy.swift AnyAnime/Phim4KMediaProbe.swift AnyAnime/MovieSourceDirectory.swift AnyAnime/MovieProvider.swift AnyAnime/Phim4KProvider.swift Tests/ProviderTests.swift -o "$RUNNER_TEMP/anpinime-provider-tests"
          "$RUNNER_TEMP/anpinime-provider-tests"
          npm install --prefix "$RUNNER_TEMP/anpinime-js-tests" jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/anpinime-js-tests/node_modules" node Tests/player.test.cjs
          swiftc AnyAnime/Phim4KTransportPolicy.swift AnyAnime/Phim4KMediaProbe.swift Tests/RangeProbeTests.swift -o "$RUNNER_TEMP/anpinime-range-tests"
          ANPINIME_RANGE_READY_FILE="$RUNNER_TEMP/anpinime-range-ready.json"
          python3 - "$ANPINIME_RANGE_READY_FILE" <<'PY'
          from pathlib import Path
          import sys
          Path(sys.argv[1]).unlink(missing_ok=True)
          PY
          ANPINIME_RANGE_PORT=0 ANPINIME_RANGE_READY_FILE="$ANPINIME_RANGE_READY_FILE" python3 -u Tests/range_probe_server.py > "$RUNNER_TEMP/anpinime-range-server.log" 2>&1 &
          ANPINIME_RANGE_SERVER=$!
          range_fixture_cleanup() {
            ANPINIME_RANGE_EXIT=$?
            kill "$ANPINIME_RANGE_SERVER" 2>/dev/null || true
            wait "$ANPINIME_RANGE_SERVER" 2>/dev/null || true
            mkdir -p previews
            cp "$RUNNER_TEMP/anpinime-range-server.log" previews/anpinime-range-server.log || true
            if [ -f "$ANPINIME_RANGE_READY_FILE" ]; then cp "$ANPINIME_RANGE_READY_FILE" previews/anpinime-range-ready.json || true; fi
            if [ "$ANPINIME_RANGE_EXIT" != 0 ]; then cat "$RUNNER_TEMP/anpinime-range-server.log" || true; fi
            return "$ANPINIME_RANGE_EXIT"
          }
          trap range_fixture_cleanup EXIT
          if ! ANPINIME_RANGE_PORT=$(python3 Tests/range_fixture_ready.py --pid "$ANPINIME_RANGE_SERVER" --ready-file "$ANPINIME_RANGE_READY_FILE"); then exit 1; fi
          export ANPINIME_RANGE_PORT
          "$RUNNER_TEMP/anpinime-range-tests"
          python3 Tests/range_virtual_test.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project AnyAnime.xcodeproj \
            -scheme AnyAnime \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Verify MKV playback, embedded audio and dual subtitles
        run: |
          brew install ffmpeg
          bash Tests/mpv-smoke.sh

      - name: Verify source-2 HLS through its real relay and mpv
        run: bash Tests/phim4k-live-smoke.sh hls

      - name: Verify anime dynamic episode list and selected-episode playback
        run: bash Tests/anime-smoke.sh fixture

      - name: Check current AnimeVietsub episode list and playback
        continue-on-error: true
        run: bash Tests/anime-smoke.sh live

      - name: Check public Phim4K Free1 playback
        continue-on-error: true
        run: bash Tests/phim4k-live-smoke.sh

      - name: Record bounded Free1 and Core transport observations
        if: always()
        run: python3 Tests/source2_live_probe.py

      - name: Check original Core Wakanda server 31937 playback
        continue-on-error: true
        run: bash Tests/phim4k-live-smoke.sh vip

      - name: Check live source-2 gateway and media using captured Core metadata
        continue-on-error: true
        run: bash Tests/phim4k-live-smoke.sh gateway

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnPinime_MPV_Playback_Check
          path: previews/*
          retention-days: 14

      - name: Assemble unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/anpinime.app Payload/anpinime.app
          zip -q -r AnPinime_UNSIGNED.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AnPinime_UNSIGNED
          path: AnPinime_UNSIGNED.ipa
          retention-days: 14

  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.preview && !inputs.gateway_frame_only && !inputs.ai_drama_only
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build simulator app
        run: |
          xcodebuild -quiet -project AnyAnime.xcodeproj -scheme AnyAnime -configuration Debug -sdk iphonesimulator -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Capture interface previews
        run: |
          ANPINIME_SIMULATOR_ID=$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const d=Object.values(JSON.parse(s).devices).flat().find(d=>d.name.includes("iPhone")&&d.isAvailable);if(!d)process.exit(1);process.stdout.write(d.udid)})')
          xcrun simctl boot "$ANPINIME_SIMULATOR_ID"
          xcrun simctl bootstatus "$ANPINIME_SIMULATOR_ID" -b
          xcrun simctl install "$ANPINIME_SIMULATOR_ID" build-simulator/Build/Products/Debug-iphonesimulator/anpinime.app
          xcrun simctl ui "$ANPINIME_SIMULATOR_ID" appearance dark
          mkdir -p previews
          python3 Tests/serve_player.py > "$RUNNER_TEMP/anpinime-media-server.log" 2>&1 &
          ANPINIME_SERVER_PID=$!
          trap 'kill "$ANPINIME_SERVER_PID"' EXIT
          ANPINIME_APP_DATA=$(xcrun simctl get_app_container "$ANPINIME_SIMULATOR_ID" com.xemphim.aipinime data)
          for backend in native web film4k phim4k; do
            case "$backend" in
              native) flag=--playback-smoke ;;
              web) flag=--web-playback-smoke ;;
              film4k) flag=--movie-provider-smoke ;;
              phim4k) flag=--phim4k-provider-smoke ;;
            esac
            xcrun simctl launch --terminate-running-process "$ANPINIME_SIMULATOR_ID" com.xemphim.aipinime "$flag"
            for attempt in $(seq 1 45); do
              if [ -f "$ANPINIME_APP_DATA/Documents/playback-$backend.json" ]; then break; fi
              sleep 1
            done
            xcrun simctl io "$ANPINIME_SIMULATOR_ID" screenshot "previews/playback-$backend.png"
            cp "$RUNNER_TEMP/anpinime-media-server.log" previews/fixture-server.log
            test -f "$ANPINIME_APP_DATA/Documents/playback-$backend.json"
            cp "$ANPINIME_APP_DATA/Documents/playback-$backend.json" "previews/playback-$backend.json"
          done
          for scene in choice movies loading player episodes settings subtitles quality list movie-loading app-settings; do
            xcrun simctl launch --terminate-running-process "$ANPINIME_SIMULATOR_ID" com.xemphim.aipinime --ui-preview "$scene"
            sleep 7
            xcrun simctl io "$ANPINIME_SIMULATOR_ID" screenshot "previews/$scene.png"
          done
      - name: Check live Film4k playback
        continue-on-error: true
        run: |
          ANPINIME_SIMULATOR_ID=$(xcrun simctl list devices booted -j | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(Object.values(JSON.parse(s).devices).flat()[0].udid))')
          ANPINIME_APP_DATA=$(xcrun simctl get_app_container "$ANPINIME_SIMULATOR_ID" com.xemphim.aipinime data)
          xcrun simctl launch --terminate-running-process "$ANPINIME_SIMULATOR_ID" com.xemphim.aipinime --film4k-live-smoke
          for attempt in $(seq 1 70); do
            if [ -f "$ANPINIME_APP_DATA/Documents/playback-film4k-live.json" ]; then break; fi
            sleep 1
          done
          xcrun simctl io "$ANPINIME_SIMULATOR_ID" screenshot previews/film4k-live.png
          test -f "$ANPINIME_APP_DATA/Documents/playback-film4k-live.json"
          cp "$ANPINIME_APP_DATA/Documents/playback-film4k-live.json" previews/
      - name: Check live source 2 playback
        continue-on-error: true
        run: |
          ANPINIME_SIMULATOR_ID=$(xcrun simctl list devices booted -j | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(Object.values(JSON.parse(s).devices).flat()[0].udid))')
          ANPINIME_APP_DATA=$(xcrun simctl get_app_container "$ANPINIME_SIMULATOR_ID" com.xemphim.aipinime data)
          xcrun simctl launch --terminate-running-process "$ANPINIME_SIMULATOR_ID" com.xemphim.aipinime --phim4k-live-smoke
          for attempt in $(seq 1 90); do
            if [ -f "$ANPINIME_APP_DATA/Documents/playback-phim4k-live.json" ]; then break; fi
            sleep 1
          done
          xcrun simctl io "$ANPINIME_SIMULATOR_ID" screenshot previews/phim4k-live.png
          test -f "$ANPINIME_APP_DATA/Documents/playback-phim4k-live.json"
          cp "$ANPINIME_APP_DATA/Documents/playback-phim4k-live.json" previews/
      - name: Record logo transitions
        if: always()
        run: |
          ANPINIME_SIMULATOR_ID=$(xcrun simctl list devices booted -j | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(Object.values(JSON.parse(s).devices).flat()[0].udid))')
          mkdir -p previews
          for scene in intro switch; do
            xcrun simctl io "$ANPINIME_SIMULATOR_ID" recordVideo --codec=h264 "previews/$scene.mp4" &
            ANPINIME_RECORD_PID=$!
            sleep 1
            xcrun simctl launch --terminate-running-process "$ANPINIME_SIMULATOR_ID" com.xemphim.aipinime --ui-preview "$scene"
            sleep 4
            kill -INT "$ANPINIME_RECORD_PID"
            wait "$ANPINIME_RECORD_PID" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnPinime_Interface_Previews
          path: previews/*
          retention-days: 14

  gateway-video:
    if: github.event_name == 'workflow_dispatch' && inputs.gateway_frame_only && !inputs.ai_drama_only
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare simulator project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build simulator app
        run: |
          xcodebuild -quiet -project AnyAnime.xcodeproj -scheme AnyAnime \
            -configuration Debug -sdk iphonesimulator -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO build
      - name: Boot simulator and install app
        run: |
          ANPINIME_SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"] and d["isAvailable"]))')
          xcrun simctl boot "$ANPINIME_SIMULATOR_ID"
          xcrun simctl bootstatus "$ANPINIME_SIMULATOR_ID" -b
          xcrun simctl install "$ANPINIME_SIMULATOR_ID" build-simulator/Build/Products/Debug-iphonesimulator/anpinime.app
      - name: Verify live gateway and later video frame with captured Core metadata
        run: bash Tests/phim4k-live-smoke.sh gateway
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnPinime_Source2_Gateway_Video
          path: previews/*
          retention-days: 14

  ai-drama:
    if: github.event_name == 'workflow_dispatch' && inputs.ai_drama_only
    runs-on: macos-26
    timeout-minutes: 25
    env:
      ANPINIME_AI_DERIVED_DATA: ${{ github.workspace }}/build-ai-simulator
    steps:
      - uses: actions/checkout@v4
      - name: Verify PineDrama data and complete-playlist contracts
        run: |
          swiftc AnyAnime/AIDrama/AIDramaModels.swift AnyAnime/AIDrama/PineDramaProvider.swift Tests/AIDramaProviderTests.swift -o "$RUNNER_TEMP/anpinime-ai-drama-provider-tests"
          "$RUNNER_TEMP/anpinime-ai-drama-provider-tests"
      - name: Prepare iOS project and test media tools
        run: |
          brew install xcodegen ffmpeg
          xcodegen generate
      - name: Verify actual portrait swipes, full playlist and player lifetime
        run: bash Tests/ai-drama-smoke.sh
      - name: Verify live PineDrama catalog, complete series and episodes 1, 2 and 40
        continue-on-error: true
        run: bash Tests/ai-drama-live-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnPinime_AI_Drama_Verification
          path: previews/**
          retention-days: 14
