name: Build AnPinime IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify parsing and playback regressions
        run: |
          swiftc AnyAnime/Models.swift AnyAnime/HTMLParser.swift Tests/main.swift -o "$RUNNER_TEMP/anpinime-parser-tests"
          "$RUNNER_TEMP/anpinime-parser-tests"
          npm install --prefix "$RUNNER_TEMP/anpinime-js-tests" jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/anpinime-js-tests/node_modules" node Tests/player.test.cjs

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project AnyAnime.xcodeproj \
            -scheme AnyAnime \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Assemble unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/anpinime.app Payload/anpinime.app
          zip -q -r AnPinime_UNSIGNED.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AnPinime_UNSIGNED
          path: AnPinime_UNSIGNED.ipa
          retention-days: 14
