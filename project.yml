name: AnyAnime
options:
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    CLANG_ENABLE_MODULES: YES
    ENABLE_BITCODE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  AnyAnime:
    type: application
    platform: iOS
    sources:
      - path: AnyAnime/AnyAnimeApp.swift
      - path: AnyAnime/AnimeBrowserModel.swift
      - path: AnyAnime/BrowserScreen.swift
      - path: AnyAnime/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.34306.anyani
        PRODUCT_NAME: AnyAnime
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AnyAnime/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.0'
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual
schemes:
  AnyAnime:
    build:
      targets:
        AnyAnime: all
    run:
      config: Debug
    archive:
      config: Release
