name: AnyAnime
options:
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    CLANG_ENABLE_MODULES: YES
    ENABLE_BITCODE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    revision: d9194243bdc68b87d8989376ab52aee7da6c8e0b
targets:
  AnyAnime:
    dependencies:
      - package: MPVKit
        product: MPVKit
    type: application
    platform: iOS
    sources:
      - path: AnyAnime
        excludes:
          - Info.plist
      - path: Code_Generated_Image.gif
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xemphim.aipinime
        PRODUCT_NAME: anpinime
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AnyAnime/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.0'
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual
  AnyAnimeUI:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AIDramaUITests.swift
      - path: Tests/MovieSearchUITests.swift
    dependencies:
      - target: AnyAnime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xemphim.aipinime.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AnyAnime
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual
schemes:
  AnyAnime:
    build:
      targets:
        AnyAnime: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnyAnimeUI
    archive:
      config: Release
